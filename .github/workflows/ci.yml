name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ACR_NAME: pranalyzeracr
  IMAGE_NAME: pr-risk-analyzer
  IMAGE_TAG: v1
  RESOURCE_GROUP: pr-risk-analyzer-rg
  CONTAINER_GROUP: pr-risk-analyzer

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run unit tests with coverage
        run: pytest tests/ -m "not integration" --cov=analyzer --cov-report=term-missing

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Terraform state storage
        run: |
          az storage account create \
            --name pranalyzertfstate \
            --resource-group pr-risk-analyzer-rg \
            --location eastus \
            --sku Standard_LRS \
            --allow-blob-public-access false || echo "Storage account already exists"

          az storage container create \
            --name tfstate \
            --account-name pranalyzertfstate \
            --auth-mode login || echo "Container already exists"

      - name: Grant Service Principal Key Vault access (breaks chicken-and-egg with Terraform data sources)
        run: |
          az keyvault set-policy \
            --name pr-analyzer-vault \
            --spn "${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}" \
            --secret-permissions get list

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Import existing resources (safe to ignore "already managed" or "non-existent object" errors)
        working-directory: infrastructure
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          set +e

          echo "--- Importing Resource Group ---"
          terraform import -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            azurerm_resource_group.main \
            /subscriptions/5ad1464e-4243-495c-bc18-05ea61733c45/resourceGroups/pr-risk-analyzer-rg

          echo "--- Importing Key Vault ---"
          terraform import -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            azurerm_key_vault.main \
            /subscriptions/5ad1464e-4243-495c-bc18-05ea61733c45/resourceGroups/pr-risk-analyzer-rg/providers/Microsoft.KeyVault/vaults/pr-analyzer-vault

          echo "--- Importing Key Vault Access Policy ---"
          terraform import -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            azurerm_key_vault_access_policy.sp_policy \
            "/subscriptions/5ad1464e-4243-495c-bc18-05ea61733c45/resourceGroups/pr-risk-analyzer-rg/providers/Microsoft.KeyVault/vaults/pr-analyzer-vault/objectId/90cda166-5d69-47d9-bf0c-bc7e05f86ff5"

          echo "--- Importing ACR ---"
          terraform import -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            azurerm_container_registry.acr \
            /subscriptions/5ad1464e-4243-495c-bc18-05ea61733c45/resourceGroups/pr-risk-analyzer-rg/providers/Microsoft.ContainerRegistry/registries/pranalyzeracr

          echo "--- Importing Container Group (may not exist if a prior run destroyed it — that's fine, apply will create it fresh) ---"
          terraform import -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            azurerm_container_group.analyzer \
            /subscriptions/5ad1464e-4243-495c-bc18-05ea61733c45/resourceGroups/pr-risk-analyzer-rg/providers/Microsoft.ContainerInstance/containerGroups/pr-risk-analyzer

          echo "--- Import step complete ---"
          exit 0

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}"
        working-directory: infrastructure
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Logout of Azure
        run: az logout

  build-and-deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          for i in 1 2 3; do
            az acr login --name ${{ env.ACR_NAME }} && exit 0
            echo "ACR login attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "ACR login failed after 3 attempts"
          exit 1

      - name: Build Docker image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push image to ACR
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy to Azure Container Instances
        run: |
          az container start \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_GROUP }}

      - name: Logout of Azure
        run: az logout
