name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ACR_NAME: pranalyzeracr
  IMAGE_NAME: pr-risk-analyzer
  IMAGE_TAG: v1
  RESOURCE_GROUP: pr-risk-analyzer-rg
  CONTAINER_GROUP: pr-risk-analyzer

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run unit tests with coverage
        run: pytest tests/ -m "not integration" --cov=analyzer --cov-report=term-missing

  build-and-deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    needs: test                    # only runs if tests pass
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'  # only on push to main, not PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push image to ACR
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy to Azure Container Instances
        run: |
          az container start \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_GROUP }}

      - name: Logout of Azure
        run: az logout